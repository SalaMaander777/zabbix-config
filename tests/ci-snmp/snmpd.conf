# Имитатор SNMP-агента для CI (net-snmp в alpine).
agentaddress udp:161
rocommunity public
# SNMPv3 authPriv SHA/AES128, как в docs/CISCO.md (пользователь zbxmon)
createUser zbxmon SHA zbx-auth-pass1 AES zbx-priv-pass1
rouser zbxmon priv
sysdescr Cisco IOS Software, CI simulator
syslocation CI
syscontact ci
# Infinet: числовые OID шаблона (infinet_pass.py)
pass_persist .1.3.6.1.4.1.3942 /ci-snmp/infinet_pass.py
