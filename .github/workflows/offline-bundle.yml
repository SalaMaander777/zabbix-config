name: offline-bundle
# Собирает и проверяет офлайн-комплект (amd64), результат - артефакт zabbix-offline.
on:
  workflow_dispatch:
  push:
    paths: ['docker-compose.yml', 'server/**', 'scripts/**', 'templates/**', 'zabbix/**', '.env.example', 'docker-compose.map.yml', 'map/**', '.github/workflows/offline-bundle.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Образы и файлы стека
        run: |
          cp .env.example .env
          sed -i "s/CHANGE_ME_LONG_RANDOM/ci-$(openssl rand -hex 8)/" .env
          SKIP_INSTALLERS=1 scripts/build-offline-bundle.sh
      - name: Проверка стека (запуск, настройка, шаблоны, бэкап)
        run: |
          chmod 777 backups
          export MAP_COMPOSE="-f docker-compose.yml -f docker-compose.map.yml"
          docker compose $MAP_COMPOSE build zabbix-map
          docker compose $MAP_COMPOSE up -d --no-build
          for i in $(seq 1 60); do
            curl -fsS -H 'Content-Type: application/json-rpc' -d '{"jsonrpc":"2.0","method":"apiinfo.version","params":{},"id":1}' http://localhost/api_jsonrpc.php && break
            sleep 5
          done
          sleep 20
          docker compose exec -T zabbix-server python3 /opt/zbx-tools/post_setup.py
          docker compose exec -T zabbix-server /usr/lib/zabbix/externalscripts/esmd_check.py tcp zabbix-web 8080
          docker compose exec -T zabbix-server python3 /opt/zbx-tools/export_config.py
          docker compose exec -T postgres sh -c 'pg_dump -U $POSTGRES_USER -Fc -f /backups/ci.dump $POSTGRES_DB'
          ls -la backups backups/config-*
          docker compose $MAP_COMPOSE ps
      - name: Смоук-тест карты
        run: |
          MAP_COMPOSE="-f docker-compose.yml -f docker-compose.map.yml"
          docker compose $MAP_COMPOSE exec -T zabbix-server python3 - <<'PY'
          import sys
          sys.path.insert(0, "/opt/zbx-tools")
          from zbxapi import Api
          a = Api()
          gid = a.call("hostgroup.get", {"filter": {"name": ["Linux servers"]}})[0]["groupid"]
          a.call("host.create", {"host": "map-smoke", "groups": [{"groupid": gid}], "inventory_mode": 0,
                                 "inventory": {"location_lat": "55.75", "location_lon": "37.62"}})
          PY
          for i in $(seq 1 20); do curl -fsS http://localhost:8081/healthz && break; sleep 3; done
          curl -fsS http://localhost:8081/api/hosts | tee /tmp/hosts.json | head -c 600; echo
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/hosts.json"))
          h = [x for x in d["hosts"] if x["host"] == "map-smoke"]
          assert h and h[0]["lat"] == 55.75 and h[0]["lon"] == 37.62, d["summary"]
          PY
          curl -fsS -o /tmp/export.xlsx http://localhost:8081/export.xlsx
          test "$(head -c2 /tmp/export.xlsx)" = PK
          curl -fsS http://localhost:8081/ | grep -q leaflet
      - name: Логи при ошибке
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.map.yml logs --tail 80
      - name: Остановка
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.map.yml down -v; sudo rm -rf backups/ci.dump backups/config-*
      - name: Установщики и контрольные суммы
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf dist; scripts/build-offline-bundle.sh
          rm -f dist/*/.env
          du -sh dist/*; cat dist/*/SHA256SUMS | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: zabbix-offline
          path: dist/
          compression-level: 0
          retention-days: 30
