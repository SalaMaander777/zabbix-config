name: ps-check
# Проверка PowerShell-скриптов в Windows PowerShell 5.1: синтаксис всех .ps1 и пробный запуск precheck.ps1 (только чтение).
on:
  workflow_dispatch:
  push:
    paths: ['scripts/*.ps1', 'tests/ps/**', '.github/workflows/ps-check.yml']
jobs:
  ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Синтаксис (PowerShell 5.1)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $bad = 0
          Get-ChildItem scripts\*.ps1, tests\ps\*.ps1 | ForEach-Object {
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$err)
            $raw = [IO.File]::ReadAllBytes($_.FullName)
            $bom = ($raw[0] -eq 0xEF -and $raw[1] -eq 0xBB -and $raw[2] -eq 0xBF)
            if ($err.Count -or -not $bom) { $bad++; Write-Host "ОШИБКА $($_.Name) bom=$bom"; $err | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" } }
            else { Write-Host "OK $($_.Name)" }
          }
          if ($bad) { exit 1 }
      - name: Пробный запуск precheck.ps1
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\scripts\precheck.ps1
          Get-Content .\scripts\precheck-*.txt -Encoding UTF8 | Select-Object -First 5
  pester:
    # Чистые функции скриптов (разбор SHA256SUMS, разбор bridgedifs, выбор образа install.wim) в Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester 5 (PowerShell 5.1)
        shell: powershell
        run: |
          $m = Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $m -or $m.Version.Major -lt 5) {
            Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
            $m = Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1
          }
          Import-Module $m.Path -Force
          "PowerShell $($PSVersionTable.PSVersion), Pester $($m.Version)"
          $r = Invoke-Pester -Path tests\ps -Output Detailed -PassThru
          if ($r.FailedCount -or -not $r.TotalCount) { exit 1 }
  virtualbox:
    # Запасной вариант A2: установка VirtualBox и создание ВМ без запуска. Если на раннере VirtualBox не встаёт
    # (драйверы, Hyper-V), шаги не роняют проверку: смотреть журнал.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать установщики
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force C:\vbinst | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          $v = '7.1.18'; $b = '173720'
          Invoke-WebRequest "https://download.virtualbox.org/virtualbox/$v/VirtualBox-$v-$b-Win.exe" -OutFile "C:\vbinst\VirtualBox-$v-$b-Win.exe"
          Invoke-WebRequest "https://download.virtualbox.org/virtualbox/$v/SHA256SUMS" -OutFile C:\vbinst\SHA256SUMS
          Invoke-WebRequest 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile C:\vbinst\vc_redist.x64.exe
          Get-ChildItem C:\vbinst | Format-Table Name, Length
      - name: Установка (virtualbox-install.ps1)
        id: inst
        continue-on-error: true
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\scripts\virtualbox-install.ps1 -InstallerDir C:\vbinst
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Создание ВМ без запуска (virtualbox-create-vm.ps1)
        if: steps.inst.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $vbm = "$env:ProgramFiles\Oracle\VirtualBox\VBoxManage.exe"
          & $vbm --version
          & $vbm list bridgedifs
          New-Item -ItemType Directory -Force C:\vbtest | Out-Null
          & $vbm createmedium disk --filename C:\vbtest\fake.vdi --size 100
          $if = ((& $vbm list bridgedifs) | Select-String '^Name:\s+(.+?)\s*$' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "Адаптер для теста: $if"
          .\scripts\virtualbox-create-vm.ps1 -DiskPath C:\vbtest\fake.vdi -NetAdapterName $if -BaseFolder C:\vbtest\vms -NoStart -NoAutostart
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $vbm showvminfo ZabbixVM --machinereadable | Select-String '^(firmware|memory|cpus|nic1|nictype1|bridgeadapter1|ioapic|rtcuseutc|graphicscontroller|storagecontrollername0|SATA-0-0)='

  agent:
    # Установка агента 2 скриптом install-agent.ps1 (Windows x64, как Windows 10/11 и LTSC 2019)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать агент
        shell: powershell
        run: |
          $v = (Select-String -Path .env.example -Pattern '^ZBX_VERSION=(.+)$').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force inst | Out-Null
          Invoke-WebRequest "https://cdn.zabbix.com/zabbix/binaries/stable/7.0/$v/zabbix_agent2-$v-windows-amd64-openssl.msi" -OutFile "inst\zabbix_agent2-$v-windows-amd64-openssl.msi"
      - name: install-agent.ps1
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\scripts\install-agent.ps1 -Server 127.0.0.1 -HostName ci-win -InstallerDir .\inst
          Start-Sleep 5
          (Get-Service 'Zabbix Agent 2').Status
          if ((Get-Service 'Zabbix Agent 2').Status -ne 'Running') { exit 1 }
          if (-not (Get-NetTCPConnection -LocalPort 10050 -State Listen -ErrorAction SilentlyContinue)) { Write-Host 'порт 10050 не слушается'; exit 1 }
          $conf = Get-ChildItem 'C:\Program Files\Zabbix Agent 2\zabbix_agent2.conf'
          Select-String -Path $conf -Pattern '^(Server|ServerActive|Hostname)='
          if (-not (Select-String -Path $conf -Pattern '^Hostname=ci-win')) { exit 1 }
          Get-NetFirewallRule -DisplayName 'Zabbix agent 10050' | Select-Object DisplayName, Enabled
          # повторный запуск должен пройти (идемпотентность)
          .\scripts\install-agent.ps1 -Server 127.0.0.1 -HostName ci-win -InstallerDir .\inst
